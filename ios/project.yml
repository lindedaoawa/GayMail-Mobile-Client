name: GayMail
options:
  bundleIdPrefix: org.mort
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  GayMail:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: GayMail
    settings:
      base:
        PRODUCT_NAME: GayMail
        PRODUCT_BUNDLE_IDENTIFIER: org.mort.gaymail
        INFOPLIST_FILE: GayMail/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        SWIFT_EMIT_LOC_STRINGS: "NO"

  GayMailTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: GayMailTests
    dependencies:
      - target: GayMail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.mort.gaymail.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  GayMail:
    build:
      targets:
        GayMail: all
        GayMailTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GayMailTests